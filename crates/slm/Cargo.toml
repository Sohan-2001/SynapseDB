[package]
name = "synapse-slm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
synapse-catalog = { path = "../catalog" }
synapse-columnar = { path = "../columnar" }
synapse-engine = { path = "../engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
regex = "1.11"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "time", "rt"] }

[dev-dependencies]
tempfile = "3.17"
