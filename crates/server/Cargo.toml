[package]
name = "synapse-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "synapsedb"
path = "src/main.rs"

[dependencies]
synapse-wal = { path = "../wal" }
synapse-catalog = { path = "../catalog" }
synapse-columnar = { path = "../columnar" }
synapse-engine = { path = "../engine" }
synapse-slm = { path = "../slm" }

tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.17"
