<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="db-grad-1" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="db-grad-top" x1="16" y1="12" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="zap-grad" x1="26" y1="18" x2="38" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0B0F19" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="url(#db-grad-1)" stroke-opacity="0.3" stroke-width="1" />

  <!-- Layer 3 (Bottom Disk) -->
  <path d="M16 40 C16 35 48 35 48 40 L48 44 C48 49 16 49 16 44 Z" fill="url(#db-grad-1)" opacity="0.6" />
  <ellipse cx="32" cy="40" rx="16" ry="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Layer 2 (Middle Disk) -->
  <path d="M16 29 C16 24 48 24 48 29 L48 33 C48 38 16 38 16 33 Z" fill="url(#db-grad-1)" opacity="0.8" />
  <ellipse cx="32" cy="29" rx="16" ry="4" fill="#1E293B" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.7" />

  <!-- Layer 1 (Top Disk) -->
  <path d="M16 18 C16 13 48 13 48 18 L48 22 C48 27 16 27 16 22 Z" fill="url(#db-grad-1)" />
  <ellipse cx="32" cy="18" rx="16" ry="4" fill="url(#db-grad-top)" stroke="#93C5FD" stroke-width="1" />

  <!-- Central Synaptic Lightning Zap -->
  <path d="M34 16 L25 31 L32 31 L29 46 L40 29 L33 29 Z" fill="url(#zap-grad)" filter="url(#glow)" />
  <path d="M34 16 L25 31 L32 31 L29 46 L40 29 L33 29 Z" fill="#FFFBEB" opacity="0.8" />

  <!-- Synaptic Nodes -->
  <circle cx="14" cy="26" r="2" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="50" cy="36" r="2" fill="#818CF8" filter="url(#glow)" />
  <circle cx="48" cy="19" r="1.5" fill="#34D399" filter="url(#glow)" />
</svg>
