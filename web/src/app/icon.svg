<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="syn-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#051B14" />
    </linearGradient>
    <linearGradient id="syn-emerald-top" x1="14" y1="14" x2="50" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="syn-emerald-mid" x1="14" y1="26" x2="50" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="syn-emerald-bot" x1="14" y1="38" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="syn-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="syn-glow-line" x1="20" y1="16" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="syn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge with Emerald Rim -->
  <rect width="64" height="64" rx="16" fill="url(#syn-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#syn-border)" stroke-width="1.5" />

  <!-- Tier 3 (Bottom Disk: WAL) -->
  <path d="M16 40 C16 35 48 35 48 40 L48 45 C48 50 16 50 16 45 Z" fill="url(#syn-emerald-bot)" opacity="0.85" />
  <ellipse cx="32" cy="40" rx="16" ry="5" fill="#0B132B" stroke="#059669" stroke-width="1.5" />

  <!-- Tier 2 (Middle Disk: Columnar SIMD) -->
  <path d="M16 29 C16 24 48 24 48 29 L48 34 C48 39 16 39 16 34 Z" fill="url(#syn-emerald-mid)" opacity="0.9" />
  <ellipse cx="32" cy="29" rx="16" ry="5" fill="#0E1E2E" stroke="#10B981" stroke-width="1.5" />
  <!-- Columnar vector partitions -->
  <line x1="24" y1="28" x2="24" y2="35" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.6" />
  <line x1="40" y1="28" x2="40" y2="35" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Tier 1 (Top Disk: Active MemTable) -->
  <path d="M16 18 C16 13 48 13 48 18 L48 23 C48 28 16 28 16 23 Z" fill="url(#syn-emerald-top)" />
  <ellipse cx="32" cy="18" rx="16" ry="5" fill="#132E27" stroke="#34D399" stroke-width="1.5" />

  <!-- Synaptic Pathway Connecting Database Tiers -->
  <path
    d="M24 18 C34 21 28 27 38 29 C46 31 26 37 30 44"
    stroke="url(#syn-glow-line)"
    stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#syn-glow)"
  />

  <!-- Synaptic Neural Nodes -->
  <circle cx="24" cy="18" r="2.5" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" filter="url(#syn-glow)" />
  <circle cx="38" cy="29" r="2.5" fill="#ECFDF5" stroke="#34D399" stroke-width="1.2" filter="url(#syn-glow)" />
  <circle cx="30" cy="44" r="2.5" fill="#ECFDF5" stroke="#059669" stroke-width="1.2" filter="url(#syn-glow)" />

  <!-- Satellite pulse nodes -->
  <circle cx="42" cy="17" r="1.5" fill="#6EE7B7" opacity="0.9" />
  <circle cx="20" cy="33" r="1.5" fill="#6EE7B7" opacity="0.8" />
</svg>
