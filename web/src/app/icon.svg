<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="disk-face" x1="16" y1="14" x2="48" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="zap" x1="28" y1="14" x2="36" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="url(#emerald-grad)" stroke-opacity="0.35" stroke-width="1" />

  <!-- Bottom Cylinder -->
  <path d="M18 42 C18 38 46 38 46 42 L46 46 C46 50 18 50 18 46 Z" fill="url(#emerald-grad)" opacity="0.35" />
  <ellipse cx="32" cy="42" rx="14" ry="3.5" fill="#111827" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Middle Cylinder -->
  <path d="M18 32 C18 28 46 28 46 32 L46 36 C46 40 18 40 18 36 Z" fill="url(#emerald-grad)" opacity="0.55" />
  <ellipse cx="32" cy="32" rx="14" ry="3.5" fill="#111827" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.7" />

  <!-- Top Cylinder -->
  <path d="M18 22 C18 18 46 18 46 22 L46 26 C46 30 18 30 18 26 Z" fill="url(#emerald-grad)" opacity="0.85" />
  <ellipse cx="32" cy="22" rx="14" ry="3.5" fill="url(#disk-face)" stroke="#A7F3D0" stroke-width="0.8" />

  <!-- Lightning Bolt (Synapse) -->
  <path d="M35 14 L26 30 L32 30 L28 48 L39 28 L33 28 Z" fill="url(#zap)" filter="url(#glow)" />
  <path d="M35 14 L26 30 L32 30 L28 48 L39 28 L33 28 Z" fill="#ECFDF5" opacity="0.85" />

  <!-- Accent dots (neural nodes) -->
  <circle cx="15" cy="30" r="1.5" fill="#34D399" opacity="0.9" filter="url(#glow)" />
  <circle cx="49" cy="38" r="1.5" fill="#10B981" opacity="0.9" filter="url(#glow)" />
  <circle cx="47" cy="22" r="1.2" fill="#6EE7B7" opacity="0.8" filter="url(#glow)" />
</svg>
