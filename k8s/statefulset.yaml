apiVersion: v1
kind: Service
metadata:
  name: synapsedb-service
  labels:
    app: synapsedb
spec:
  ports:
    - port: 8765
      name: wire-protocol
      targetPort: 8765
  clusterIP: None
  selector:
    app: synapsedb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapsedb
spec:
  serviceName: "synapsedb-service"
  replicas: 1
  selector:
    matchLabels:
      app: synapsedb
  template:
    metadata:
      labels:
        app: synapsedb
    spec:
      containers:
        - name: synapsedb
          image: synapsedb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: wire-protocol
          env:
            - name: SYNAPSE_ADDR
              value: "0.0.0.0:8765"
            - name: SYNAPSE_DATA_DIR
              value: "/data"
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: synapsedb-storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: synapsedb-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
