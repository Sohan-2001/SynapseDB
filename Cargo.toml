[workspace]
resolver = "2"
members = [
    "crates/wal",
    "crates/catalog",
    "crates/columnar",
    "crates/engine",
    "crates/slm",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SynapseDB Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
